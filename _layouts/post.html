<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} - ksirblog抖音风github博客{% else %}ksirblog - 抖音网红快手主播网红blog{% endif %}</title>
<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% else %}ksirblog是一个极具抖音风特色的github博客，汇聚抖音网红、快手主播与各类网红的创意内容。{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;color:#444;font:16px/1.6 sans-serif;padding:20px 30px}
a{color:#444;text-decoration:none}
.nav-header{margin-bottom:30px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.post-header{margin-bottom:30px}
.post-title{font-size:18px;line-height:1.5;margin-bottom:10px}
.post-meta{font-size:12px}
.post-content{font-size:16px;line-height:1.6}
.post-content p{margin-bottom:20px}
.post-content img{max-width:100%;height:auto;margin:10px 0}
#encrypt-mask{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lock-icon{font-size:40px;margin-bottom:20px}
.lock-msg{font-size:18px;margin-bottom:30px}
.pwd-input{padding:10px 15px;font-size:16px;border:1px solid #ddd;width:200px;text-align:center;outline:none}
.unlock-btn{margin-top:15px;padding:8px 25px;border:none;cursor:pointer;font-size:14px}
.error-msg{font-size:14px;margin-top:10px;display:none;color:#d9534f}
@media(max-width:600px){
body{padding:15px 20px}
.post-title{font-size:16px}
.post-content{font-size:16px}
.pwd-input{width:80%}
}
</style>
</head>
<body>
    <div class="nav-header">
        <a href="/" title="返回ksirblog首页">← 返回首页</a>
        <span>ksirblog</span>
    </div>
    <article class="post">
        <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-meta">{{ page.date | date: "%Y年%m月%d日" }}</div>
        </header>
        {% if page.pw %}
        <div id="secret-content" class="post-content" style="display:none">{{ content }}</div>
        <div id="encrypt-mask">
            <div class="lock-icon"></div>
            <div class="lock-msg">这篇文章受密码保护，请输入密码继续阅读</div>
            <input type="password" id="pwd-input" class="pwd-input" placeholder="输入密码">
            <button onclick="checkPwd()" class="unlock-btn">确 定</button>
            <div id="error-msg" class="error-msg">密码错误，请重试</div>
        </div>
        {% else %}
        <div class="post-content">{{ content }}</div>
        {% endif %}
    </article>
<script>
var mask=document.getElementById('encrypt-mask');
if(mask){
    var correctPwd="{{ page.pw }}".trim();
    var contentDiv=document.getElementById('secret-content');
    var input=document.getElementById('pwd-input');
    var errorDiv=document.getElementById('error-msg');
    function checkPwd(){
        var val=input.value;
        if(!val)return;
        if(val===correctPwd){
            mask.style.display='none';
            contentDiv.style.display='block';
            sessionStorage.setItem('post_pwd_'+location.pathname,val);
            errorDiv.style.display='none';
        }else{
            errorDiv.style.display='block';
            input.value='';
            input.focus();
        }
    }
    window.onload=function(){
        var urlPwd=new URLSearchParams(location.search).get('pwd');
        if(urlPwd){
            input.value=urlPwd;
            checkPwd();
            history.replaceState(null,'',location.pathname);
        }else if(sessionStorage.getItem('post_pwd_'+location.pathname)===correctPwd){
            mask.style.display='none';
            contentDiv.style.display='block';
        }
        input.focus();
        input.addEventListener('keypress',function(e){
            if(e.key==='Enter')checkPwd();
        })
    }
}
</script>
</body>
</html>
