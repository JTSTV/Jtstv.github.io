---
layout: null
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="index,follow">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
{% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font:16px system-ui,-apple-system,sans-serif;background:#f7f8fa;color:#2c333a;padding:24px 16px;line-height:1.75}.container{max-width:720px;margin:0 auto}.post-title{font-size:22px;margin-bottom:8px}.post-date{font-size:14px;color:#666;margin-bottom:16px}.post-content p{margin-bottom:16px}.post-content img{max-width:100%;height:auto;margin:12px 0}.post-content h1,.post-content h2,.post-content h3{margin:20px 0 10px;text-decoration:underline;text-underline-offset:4px}.post-content ul{padding-left:1.8em !important;margin:12px 0}.post-content ol{padding-left:1.8em !important;margin:12px 0}.post-content li{margin-bottom:8px}.post-content pre,.post-content table{max-width:100%;overflow-x:auto}@media(max-width:600px){body{padding:16px 12px}.post-title{font-size:20px}.post-content ul,.post-content ol{padding-left:1.4em !important}}</style>
</head>
<body>
<div class="container">
<div class="post-title">{{ page.title }}</div>
<div class="post-date">{{ page.date | date:"%Y-%m-%d" }}</div>
<div class="post-content">{{ content }}</div>
</div>
</body>
</html>
