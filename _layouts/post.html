---
layout: null
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
{% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font:19px system-ui,-apple-system,sans-serif;background:#f7f8fa;padding:56px 40px;line-height:2.2}.container{max-width:720px;margin:0 auto}.post-title{font-size:28px;margin-bottom:14px}.post-date{font-size:18px;color:#666;margin-bottom:36px}.post-content p{margin-bottom:24px}.post-content img{max-width:100%;height:auto;margin:18px 0}.post-content h1,.post-content h2,.post-content h3{margin:28px 0 14px}.post-content ul{padding-left:1.8em !important;margin:18px 0}.post-content ol{padding-left:1.8em !important;margin:18px 0}.post-content li{margin-bottom:12px}.post-content pre,.post-content table{max-width:100%;overflow-x:auto}@media(max-width:600px){body{padding:32px 24px}.post-title{font-size:24px}.post-date{font-size:17px;margin-bottom:28px}.post-content ul,.post-content ol{padding-left:1.4em !important}}</style>
</head>
<body>
<div class="container">
<div class="post-title">{{ page.title }}</div>
<div class="post-date">{{ page.date | date:"%Y-%m-%d" }}</div>
<div class="post-content">{{ content }}</div>
</div>
</body>
</html>
