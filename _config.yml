# --- 核心基础配置 ---
title: KBlog
SEOTitle: "KBlog｜个人技术博客，记录生活与技术分享"
description: "KBlog 个人独立博客，专注技术笔记、创意内容与经验分享，沉淀日常学习与思考。"
keywords: "KBlog,blog,个人博客,技术博客,博客,独立博客,github博客"
baseurl: ""
url: "https://hhzj.hair"

# ========== 修复时区！北京时间东八区，解决当天写的文章被当成未来文章隐藏 ==========
timezone: Asia/Shanghai

# --- 性能与构建优化 ---
future: false
permalink: pretty
paginate: 6
paginate_path: "/page:num/"

# --- 核心插件 ---
plugins:
  - jekyll-paginate

# --- Markdown 渲染优化 ---
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
email: "jtstv@outlook.com"