# --- 核心基础配置 ---
title: KsirBlog
SEOTitle: ksirBlog
description: "抖音风GitHub博客，汇聚网红创意与技术分享"
baseurl: ""
url: "https://hhzj.hair"

# ========== 修复时区！北京时间东八区，解决当天写的文章被当成未来文章隐藏 ==========
timezone: Asia/Shanghai

# --- 性能与构建优化 ---
future: false
permalink: pretty
paginate: 6
paginate_path: "/page:num/"

# --- 核心插件 ---
plugins:
  - jekyll-paginate

# --- Markdown 渲染优化 ---
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1