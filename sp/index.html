<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的资源列表</title>
    <style>
        /* 基础样式重置与变量定义 */
        :root {
            --primary: #007AFF;
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #1c1c1e;
            --sub-text: #8e8e93;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card: #1c1c1e;
                --text: #ffffff;
                --sub-text: #98989d;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 20px;
            padding: 0 5px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .header p {
            font-size: 14px;
            color: var(--sub-text);
            margin: 0;
        }

        /* 列表样式 */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-item {
            background-color: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s;
        }

        .file-item:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        .file-info {
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background-color: rgba(0, 122, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .icon-box svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .file-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-name {
            font-size: 16px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .file-meta {
            font-size: 12px;
            color: var(--sub-text);
        }

        .play-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }

        .play-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            margin-left: 2px; /* 视觉修正 */
        }

        /* 全屏播放器遮罩 */
        .player-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 1000;
            display: none; /* 默认隐藏 */
            flex-direction: column;
        }

        .player-overlay.active {
            display: flex;
        }

        .video-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
        }

        video {
            width: 100%;
            max-height: 100vh;
            outline: none;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            color: white;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .close-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* 加载状态 */
        .loading-tip {
            position: absolute;
            color: white;
            font-size: 14px;
            opacity: 0.7;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>资源列表</h1>
        <p>共 <span id="count">0</span> 个文件</p>
    </div>
    
    <ul class="file-list" id="list">
        <!-- 列表项将通过 JS 插入 -->
        <li style="text-align:center; padding: 20px; color: var(--sub-text);">正在加载...</li>
    </ul>
</div>

<!-- 播放器遮罩 -->
<div class="player-overlay" id="playerOverlay">
    <div class="close-btn" onclick="closePlayer()">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </div>
    <div class="video-container">
        <div class="loading-tip" id="loadingTip">正在连接服务器...</div>
        <video id="videoPlayer" controls playsinline webkit-playsinline x5-video-player-type="h5"></video>
    </div>
</div>

<script>
    // ================= 配置区域 =================
    const CONFIG = {
        owner: 'Jtstv',          // GitHub 用户名
        repo: 'Jtstv.github.io', // 仓库名称
        path: 'sp',              // 文件夹路径 (如果是根目录留空 '')
        branch: 'main'           // 分支名称，通常是 main 或 master
    };
    // ===========================================

    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const overlay = document.getElementById('playerOverlay');
    const video = document.getElementById('videoPlayer');
    const loadingTip = document.getElementById('loadingTip');

    // 构建 GitHub Raw 内容链接 (直连)
    function getRawUrl(filename) {
        let url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}`;
        if (CONFIG.path) {
            url += `/${CONFIG.path}`;
        }
        return `${url}/${filename}`;
    }

    // 格式化文件大小
    function formatSize(bytes) {
        if (!bytes) return '未知大小';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    // 获取文件列表
    async function fetchFiles() {
        try {
            let apiUrl = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents`;
            if (CONFIG.path) {
                apiUrl += `/${CONFIG.path}`;
            }

            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('无法获取列表');
            
            const data = await response.json();
            
            // 过滤：只保留文件，排除目录（如果需要包含子目录需递归，这里简化为单层）
            const files = data.filter(item => item.type === 'file').sort((a, b) => a.name.localeCompare(b.name));
            
            renderList(files);
        } catch (error) {
            console.error(error);
            listEl.innerHTML = `<li style="text-align:center; padding: 20px; color: red;">加载失败: ${error.message} 请检查网络或配置</li>`;
        }
    }

    // 渲染列表
    function renderList(files) {
        countEl.textContent = files.length;
        listEl.innerHTML = '';

        if (files.length === 0) {
            listEl.innerHTML = '<li style="text-align:center; padding: 20px;">该目录下没有文件</li>';
            return;
        }

        files.forEach(file => {
            const li = document.createElement('li');
            li.className = 'file-item';
            
            // 判断是否为视频文件
            const isVideo = /\.(mp4|webm|ogg|mov)$/i.test(file.name);
            const iconSvg = isVideo 
                ? '<svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>' 
                : '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>';

            li.innerHTML = `
                <div class="file-info">
                    <div class="icon-box">${iconSvg}</div>
                    <div class="file-details">
                        <div class="file-name">${file.name}</div>
                        <div class="file-meta">${formatSize(file.size)}</div>
                    </div>
                </div>
                ${isVideo ? '<div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>' : ''}
            `;

            // 点击事件
            li.onclick = () => {
                if (isVideo) {
                    playVideo(getRawUrl(file.name), file.name);
                } else {
                    window.open(getRawUrl(file.name), '_blank');
                }
            };

            listEl.appendChild(li);
        });
    }

    // 播放视频逻辑
    function playVideo(url, name) {
        overlay.classList.add('active');
        loadingTip.style.display = 'block';
        loadingTip.textContent = `正在加载: ${name}...`;
        
        video.src = url;
        video.load();
        
        // 尝试自动播放
        const playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log("自动播放被拦截，等待用户点击播放");
            });
        }
    }

    // 关闭播放器
    function closePlayer() {
        overlay.classList.remove('active');
        video.pause();
        video.src = ''; // 清空源以停止缓冲
        loadingTip.style.display = 'none';
    }

    // 初始化
    fetchFiles();

</script>
</body>
</html>
