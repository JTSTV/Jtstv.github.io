<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资源列表</title>
    <style>
        /* --- 全局样式 --- */
        :root {
            --primary-brown: #8B3A3A; /* 棕红色 */
            --play-blue: #007AFF;     /* 播放按钮蓝 */
            --bg-color: #f2f2f7;      /* 浅灰背景 */
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #000;
        }

        /* --- 列表项布局 (Flexbox) --- */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-item {
            display: flex;
            flex-direction: column; /* 关键修改：改为垂直布局 */
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background-color: #fafafa;
        }

        /* --- 左侧文件名区域 --- */
        .file-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px; /* 与下方按钮区域的间距 */
        }

        .icon {
            font-size: 1.5rem;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .name-text {
            font-size: 1rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
        }

        /* --- 右侧按钮区域 --- */
        .actions {
            display: flex;
            gap: 8px;
            /* 让按钮组靠右对齐 */
            align-self: flex-end; 
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* 下载按钮 - 棕红色 */
        .btn-download {
            background-color: var(--primary-brown);
        }

        /* 播放按钮 - 蓝色 */
        .btn-play {
            background-color: var(--play-blue);
        }

        /* 文件夹打开按钮 - 灰色 */
        .btn-open {
            background-color: #6c757d;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* --- 视频播放弹窗 (Modal) --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.9); 
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            width: 90%;
            max-width: 900px;
            position: relative;
        }

        video {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 手机端适配微调 */
        @media (max-width: 480px) {
            .file-item {
                padding: 12px 15px;
            }
            .btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
            .icon {
                font-size: 1.2rem;
                margin-right: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📂 GitHub 资源列表</h2>
        <span style="font-size: 0.8rem; color: #666;">Powered by GitHub</span>
    </div>
    
    <div id="fileList" class="loading">正在加载文件列表...</div>
</div>

<!-- 视频播放器弹窗 -->
<div id="videoModal" class="modal" onclick="closeVideo()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closeVideo()">&times;</span>
        <video id="videoPlayer" controls playsinline webkit-playsinline>
            您的浏览器不支持 HTML5 视频播放。
        </video>
    </div>
</div>

<script>
    // ⚠️ 配置区域：请修改为你自己的仓库信息
    const owner = 'Jtstv';           
    const repo = 'Jtstv.github.io';  
    const path = 'sp';               

    // 核心链接生成逻辑
    const cdnBaseUrl = `https://cdn.jsdelivr.net/gh/${owner}/${repo}@latest`;
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    async function loadFiles() {
        const fileListEl = document.getElementById('fileList');
        
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('无法连接 GitHub API，请检查网络或仓库配置');
            
            const files = await response.json();
            fileListEl.innerHTML = '<ul class="file-list"></ul>';
            const listContainer = fileListEl.querySelector('ul');

            if (files.length === 0) {
                fileListEl.innerHTML = '<div class="loading">该目录下空空如也</div>';
                return;
            }

            // 排序：文件夹优先，然后按名称排序
            files.sort((a, b) => {
                if (a.type === b.type) return a.name.localeCompare(b.name);
                return a.type === 'dir' ? -1 : 1;
            });

            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                
                const isFolder = file.type === 'dir';
                const isVideo = file.name.match(/\.(mp4|mov|webm)$/i);
                
                // 图标处理
                let icon = '📄';
                if (isFolder) icon = '📁';
                else if (isVideo) icon = '🎬';
                else if (file.name.match(/\.(jpg|jpeg|png|gif)$/i)) icon = '🖼️';

                // 构建按钮 HTML
                let buttonsHtml = '';
                
                if (isFolder) {
                    buttonsHtml = `<a href="?path=${file.path}" class="btn btn-open">打开</a>`;
                } else {
                    const downloadLink = `${cdnBaseUrl}/${file.path}`;
                    buttonsHtml += `<a href="${downloadLink}" class="btn btn-download" target="_blank">下载</a>`;
                    
                    if (isVideo) {
                        const safeLink = downloadLink.replace(/'/g, "\\'"); 
                        buttonsHtml += `<button onclick="playVideo('${safeLink}')" class="btn btn-play">播放</button>`;
                    }
                }

                li.innerHTML = `
                    <div class="file-info">
                        <span class="icon">${icon}</span>
                        <span class="name-text">${file.name}</span>
                    </div>
                    <div class="actions">
                        ${buttonsHtml}
                    </div>
                `;
                listContainer.appendChild(li);
            });

        } catch (error) {
            fileListEl.innerHTML = `<div class="loading" style="color:red;">${error.message} <small>${apiUrl}</small></div>`;
        }
    }

    // --- 视频播放逻辑 ---
    function playVideo(url) {
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');
        player.src = url;
        modal.style.display = 'flex';
        player.play();
    }

    function closeVideo() {
        const modal = document.getElementById('videoModal');
        const player = document.getElementById('videoPlayer');
        modal.style.display = 'none';
        player.pause();
        player.src = '';
    }

    // 启动加载
    loadFiles();
</script>

</body>
</html>
