<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的资源列表</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e8e8e8;color:#444;padding:20px}
.container{max-width:680px;margin:0 auto}
.header{padding:15px 30px;border-radius:6px;background:#e8e8e8;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.header h2{font:600 20px/1.4 sans-serif;color:#444;margin:0}
.file-list{list-style:none}
.file-item{display:flex;flex-direction:column;padding:15px 20px 35px;margin-bottom:15px;border-radius:12px;position:relative;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#444}
.file-info{display:flex;align-items:center;margin-bottom:12px}
.icon{font-size:1.5rem;margin-right:12px;flex-shrink:0}
.name-text{font-size:1rem;line-height:1.4;word-break:break-all}
.actions{display:flex;gap:8px;align-self:flex-end}
.btn{padding:8px 16px;border-radius:20px;text-decoration:none;font-size:.9rem;font-weight:500;color:#333;border:none;cursor:pointer;transition:opacity .2s;background:rgba(255,255,255,.4)}
.btn:hover{opacity:.9}
.loading{text-align:center;padding:40px;color:#888}
/* 模态框样式 */
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.95);align-items:center;justify-content:center;overflow:hidden}
.modal-content{width:90%;max-width:900px;position:relative;max-height:100vh;display:flex;justify-content:center}
video{width:100%;height:auto;max-height:100vh;border-radius:8px;object-fit:contain;background:#000}
.close-modal{position:absolute;bottom:15px;right:15px;width:40px;height:40px;background:rgba(255,255,255,.9);color:#000;border-radius:50%;text-align:center;line-height:40px;font-size:28px;font-weight:bold;cursor:pointer;z-index:1002;box-shadow:0 2px 10px rgba(0,0,0,.3);border:none;outline:none;padding:0}

/* --- 倍速控制样式更新 --- */
.speed-control{
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    background: rgba(0,0,0,.6);
    color: #fff;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 0.7rem; 
    z-index: 1001;
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column; 
    gap: 5px;
}
.speed-btn{
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    padding: 2px 6px;
    font-size: 0.7rem; 
    border-radius: 4px;
    transition: background .2s;
}
.speed-btn:hover,.speed-btn.active{background:rgba(255,255,255,.3)}

@media(max-width:600px){.container{padding:0}.header{padding:15px 20px}.header h2{font-size:18px}.file-item{padding:12px 15px 30px}.name-text{font-size:.95rem}.icon{font-size:1.2rem;margin-right:8px}.btn{padding:6px 12px;font-size:.8rem}.modal-content{width:100%;height:100%;border-radius:0}video{border-radius:0;height:100%}}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📂 我的资源列表</h2>
    </div>
    <ul id="fileList" class="file-list">
        <li class="loading">正在加载文件列表...</li>
    </ul>
</div>

<!-- 视频播放弹窗 -->
<div id="videoModal" class="modal" onclick="closeVideo()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <video id="videoPlayer" controls playsinline webkit-playsinline preload="auto">您的浏览器不支持 HTML5 视频播放。</video>
        <div class="speed-control" id="speedControl">
            <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
            <button class="speed-btn" onclick="setSpeed(1.0)">1.0x</button>
        </div>
        <button class="close-modal" onclick="closeVideo()">&times;</button>
    </div>
</div>
