<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>我的资源列表</title><style>body{font-family:-apple-system,sans-serif;background:#e8e8e8;color:#444;padding:20px;margin:0}.box{max-width:680px;margin:0 auto}.head{display:flex;justify-content:space-between;align-items:center;padding:15px;margin-bottom:20px;border-radius:8px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.05)}.list{list-style:none;padding:0}.item{background:#fff;margin-bottom:12px;padding:15px;border-radius:10px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.03)}.info{display:flex;align-items:center;gap:10px;font-weight:500}.acts{display:flex;gap:8px;justify-content:flex-end}.btn{padding:6px 14px;border-radius:20px;text-decoration:none;font-size:.85rem;background:#f0f0f0;color:#333;border:none;cursor:pointer}.btn:hover{background:#e0e0e0}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:999;align-items:center;justify-content:center}video{width:95%;max-height:90vh;border-radius:8px;background:#000}.cls{position:absolute;bottom:20px;right:20px;width:40px;height:40px;background:#fff;border-radius:50%;font-size:24px;line-height:40px;text-align:center;cursor:pointer;color:#000}</style></head><body><div class="box"><div class="head"><h2>📂 资源列表</h2><span style="font-size:.8rem;color:#007AFF">⚡ 加速通道已就绪</span></div><ul id="list" class="list"><li style="text-align:center;padding:20px;color:#888">加载中...</li></ul></div><div id="vm" class="modal" onclick="closeV()"><div onclick="event.stopPropagation()"><video id="vp" controls playsinline></video></div><div class="cls" onclick="closeV()">&times;</div></div><script>const CFG={owner:'Jtstv',repo:'Jtstv.github.io',path:'sp',signer:'https://my.hhzj.hair',key:'MySuperSecretKey2024'};const getLink=async(p)=>{try{const r=await fetch(`${CFG.signer}?path=${encodeURIComponent(p)}&key=${CFG.key}`,{mode:'cors'});const d=await r.json();return d.url||'#'}catch(e){return'#'}};const load=async()=>{const el=document.getElementById('list');try{const res=await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`);const files=await res.json();el.innerHTML='';files.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):-1).forEach(f=>{const isVid=/\.(mp4|mov|m3u8)$/i.test(f.name);const icon=f.type==='dir'?'📁':isVid?'🎬':'📄';getLink(f.path).then(url=>{const li=document.createElement('li');li.className='item';li.innerHTML=`<div class="info"><span>${icon}</span><span>${f.name}</span></div><div class="acts">${f.type!=='dir'?`<a href="${url}" target="_blank" class="btn">下载</a>`:''}${isVid?`<button onclick="play('${url.replace(/'/g,"\\'")}')" class="btn">播放</button>`:''}`;el.appendChild(li)})})}catch(e){el.innerHTML=`<li style="color:red;text-align:center">加载失败: ${e.message}</li>`}};const play=(u)=>{const m=document.getElementById('vm'),v=document.getElementById('vp');v.src=u;m.style.display='flex';v.play().catch(()=>{})};const closeV=()=>{const m=document.getElementById('vm'),v=document.getElementById('vp');m.style.display='none';v.pause();v.src=''};load();</script></body></html>
