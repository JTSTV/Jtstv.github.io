<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私人影院</title>
    <style>
        body{margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
        .box{width:90%;max-width:800px;margin-top:20px;text-align:center}
        video{width:100%;border-radius:8px;background:#000;box-shadow:0 4px 15px rgba(0,0,0,.5)}
        .msg{margin:10px 0;font-size:14px;color:#aaa}
        button{padding:10px 20px;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer}
        button:hover{background:#0056b3}
    </style>
</head>
<body>
<div class="box">
    <video id="v" controls playsinline>您的浏览器不支持播放</video>
    <div class="msg" id="s">准备就绪</div>
    <button onclick="play()">播放测试视频</button>
</div>
<script>
    // ⚠️ 你的签名 Worker 地址
    const API = 'https://my.hhzj.hair'; 

    async function play() {
        const v = document.getElementById('v');
        const s = document.getElementById('s');
        
        // ✅ 已修复：去掉了末尾多余的单引号
        const rawUrl = 'https://www.w3schools.com/html/mov_bbb.mp4'; 

        s.innerText = '正在获取安全链接...';

        try {
            // 请求签名接口
            const res = await fetch(`${API}/?url=${encodeURIComponent(rawUrl)}`);
            
            if (!res.ok) throw new Error(`服务异常: ${res.status}`);
            
            const data = await res.json();
            
            if (data.url) {
                v.src = data.url;
                v.play();
                s.innerText = '正在播放 (防盗链生效中)';
            } else {
                throw new Error('未获取到有效链接');
            }
        } catch (e) {
            console.error(e);
            s.innerText = '播放失败: ' + e.message;
            alert('出错啦，请按F12查看控制台详情');
        }
    }
</script>
</body>
</html>
