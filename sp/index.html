<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资源列表</title>
    <style>
        :root{--primary-brown:#8B3A3A;--play-blue:#007AFF;--bg-color:#f2f2f7;--card-bg:#fff}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg-color);margin:0;padding:20px;color:#333;overflow-x:hidden}
        .container{max-width:800px;margin:0 auto;background:var(--card-bg);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.05);overflow:hidden}
        .header{padding:20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
        .header h2{margin:0;font-size:1.2rem;color:#000}
        .file-list{list-style:none;padding:0;margin:0}
        .file-item{display:flex;flex-direction:column;padding:16px 20px;border-bottom:1px solid #f0f0f0;transition:background-color .2s}
        .file-item:last-child{border-bottom:none}
        .file-item:hover{background-color:#fafafa}
        .file-info{display:flex;align-items:center;margin-bottom:12px}
        .icon{font-size:1.5rem;margin-right:12px;flex-shrink:0}
        .name-text{font-size:1rem;color:#333;word-break:break-all;line-height:1.4}
        .actions{display:flex;gap:8px;align-self:flex-end}
        .btn{padding:8px 16px;border-radius:6px;text-decoration:none;font-size:.9rem;font-weight:500;color:#fff;border:none;cursor:pointer;transition:opacity .2s;white-space:nowrap}
        .btn:hover{opacity:.9}
        .btn-download{background-color:var(--primary-brown)}
        .btn-play{background-color:var(--play-blue)}
        .btn-open{background-color:#6c757d}
        .loading{text-align:center;padding:40px;color:#888}
        .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background-color:rgba(0,0,0,.95);align-items:center;justify-content:center;overflow:hidden}
        .modal-content{width:90%;max-width:900px;position:relative;max-height:100vh;display:flex;justify-content:center}
        video{width:100%;height:auto;max-height:100vh;border-radius:8px;object-fit:contain;background:#000}
        .close-modal{position:absolute;bottom:15px;right:15px;width:40px;height:40px;background:rgba(255,255,255,.9);color:#000;border-radius:50%;text-align:center;line-height:40px;font-size:28px;font-weight:bold;cursor:pointer;z-index:1002;box-shadow:0 2px 10px rgba(0,0,0,.3);border:none;outline:none;padding:0}
        .speed-control{position:absolute;bottom:15px;left:15px;background:rgba(0,0,0,.6);color:#fff;padding:5px 10px;border-radius:20px;font-size:.8rem;z-index:1001;backdrop-filter:blur(4px);display:flex;gap:5px}
        .speed-btn{background:none;border:none;color:#fff;cursor:pointer;padding:2px 6px;font-size:.8rem;border-radius:4px;transition:background .2s}
        .speed-btn:hover,.speed-btn.active{background:rgba(255,255,255,.3)}
        @media(max-width:480px){.file-item{padding:12px 15px}.btn{padding:6px 12px;font-size:.8rem}.icon{font-size:1.2rem;margin-right:8px}.modal-content{width:100%;height:100%;border-radius:0}video{border-radius:0;height:100%}}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📂 GitHub 资源列表</h2>
        <span style="font-size:.8rem;color:#666">Powered by GitHub</span>
    </div>
    <div id="fileList" class="loading">正在加载文件列表...</div>
</div>
<div id="videoModal" class="modal" onclick="closeVideo()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <!-- 核心修改：添加 preload="auto"，让浏览器提前加载视频数据实现秒开 -->
        <video id="videoPlayer" controls playsinline webkit-playsinline preload="auto">您的浏览器不支持 HTML5 视频播放。</video>
        <div class="speed-control" id="speedControl">
            <button class="speed-btn" onclick="setSpeed(0.25)">0.25x</button>
            <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
            <button class="speed-btn" onclick="setSpeed(1.25)">1.25x</button>
            <button class="speed-btn" onclick="setSpeed(1.5)">1.5x</button>
        </div>
        <button class="close-modal" onclick="closeVideo()">&times;</button>
    </div>
</div>
<script>
const owner='Jtstv', repo='Jtstv.github.io', path='sp';

// 配置国内极速 CDN 加速源（按推荐优先级排序）
const cdnSources = [
    // 1. 国内极速代理（首选，大文件下载最稳）
    (f) => `https://ghproxy.com/https://raw.githubusercontent.com/${owner}/${repo}/main/${f}`,
    // 2. jsDelivr（备选）
    (f) => `https://cdn.jsdelivr.net/gh/${owner}/${repo}@latest/${f}`,
    // 3. FastGit（兜底）
    (f) => `https://raw.fastgit.org/${owner}/${repo}/main/${f}`
];

// 默认使用第一个源生成下载和播放链接
const getPrimaryUrl = (f) => cdnSources[0](f);
const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

async function loadFiles(){
    const el=document.getElementById('fileList');
    try{
        const res=await fetch(apiUrl);
        if(!res.ok)throw new Error('无法连接 GitHub API，请检查网络或仓库配置');
        const files=await res.json();
        el.innerHTML='<ul class="file-list"></ul>';
        const ul=el.querySelector('ul');
        if(!files.length){el.innerHTML='<div class="loading">该目录下空空如也</div>';return}
        
        files.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==='dir'?-1:1);
        files.forEach(f=>{
            const li=document.createElement('li');li.className='file-item';
            const isDir=f.type==='dir',isVid=/\.(mp4|mov|webm)$/i.test(f.name);
            let icon=isDir?'📁':isVid?'🎬':/\.(jpg|jpeg|png|gif)$/i.test(f.name)?'🖼️':'📄';
            
            let btns=isDir?`<a href="?path=${f.path}" class="btn btn-open">打开</a>`:(()=>{
                const url=getPrimaryUrl(f.path);
                let h=`<a href="${url}" class="btn btn-download" target="_blank">下载</a>`;
                if(isVid)h+=`<button onclick="playVideo('${url.replace(/'/g,"\\'")}')" class="btn btn-play">播放</button>`;
                return h;
            })();
            
            li.innerHTML=`<div class="file-info"><span class="icon">${icon}</span><span class="name-text">${f.name}</span></div><div class="actions">${btns}</div>`;
            ul.appendChild(li);
        });
    }catch(e){el.innerHTML=`<div class="loading" style="color:red">${e.message} <small>${apiUrl}</small></div>`}
}

// 视频播放逻辑（保持秒开缓冲机制）
const playVideo=url=>{
    const m=document.getElementById('videoModal'),p=document.getElementById('videoPlayer');
    p.src=url;
    m.style.display='flex';
    document.body.style.overflow='hidden';
    resetSpeedUI();
    // 当视频缓冲到可以播放时，再触发播放
    p.oncanplay=()=>{
        p.play().catch(err=>console.log('自动播放被浏览器阻止:',err));
    };
};

const closeVideo=()=>{
    const m=document.getElementById('videoModal'),p=document.getElementById('videoPlayer');
    m.style.display='none';p.pause();p.src='';document.body.style.overflow='';
};
const setSpeed=s=>{
    const p=document.getElementById('videoPlayer');p.playbackRate=s;
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.toggle('active',parseFloat(b.textContent)===s));
};
const resetSpeedUI=()=>document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));

loadFiles();
</script>
</body>
</html>
