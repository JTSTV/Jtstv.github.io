<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的资源列表</title>
    <style>
        /* --- 全局样式 --- */
        :root {
            --primary-brown: #8B3A3A;
            --play-blue: #007AFF;
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            min-height: 60vh; /* 保证容器有一定高度 */
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #000;
        }

        /* --- 列表项布局 --- */
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background-color: #fafafa;
        }

        .file-info {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .icon {
            font-size: 1.5rem;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .name-text {
            font-size: 1rem;
            color: #333;
            word-break: break-all;
            line-height: 1.4;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-self: flex-end; 
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: white;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-download { background-color: var(--primary-brown); }
        .btn-play { background-color: var(--play-blue); }
        .btn-open { background-color: #6c757d; }
        
        /* 新增：重试按钮样式 */
        .btn-retry {
            background-color: #ff3b30;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        /* --- 视频播放弹窗 (Modal) --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.95); /* 背景更黑一点 */
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .modal-content {
            width: 95%;
            max-width: 1000px;
            position: relative;
            max-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }

        /* 右下角控制面板容器 */
        .control-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1002;
        }

        .panel-group {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .panel-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            min-width: 40px;
            text-align: center;
        }

        .panel-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        .speed-display {
            color: #fff;
            font-size: 12px;
            text-align: center;
            margin-bottom: 2px;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📂 GitHub 资源列表</h2>
        <span style="font-size: 0.8rem; color: #666;">Powered by GitHub</span>
    </div>
    
    <!-- 列表容器 -->
    <div id="fileList" class="loading">正在加载文件列表...</div>
</div>

<!-- 视频播放器弹窗 -->
<div id="videoModal" class="modal" onclick="closeVideo()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-modal" onclick="closeVideo()">&times;</span>
        <!-- 增加 crossorigin 属性以尝试解决跨域问题 -->
        <video id="videoPlayer" controls playsinline webkit-playsinline crossorigin="anonymous">
            您的浏览器不支持 HTML5 视频播放。
        </video>
    </div>

    <!-- 右下角控制面板 -->
    <div class="control-panel" onclick="event.stopPropagation()">
        <!-- 变速控制 -->
        <div class="panel-group">
            <div class="speed-display" id="speedText">1.0x</div>
            <button class="panel-btn" onclick="changeSpeed(0.5)">⏪ 慢速</button>
            <button class="panel-btn" onclick="changeSpeed(1.0)">▶️ 正常</button>
            <button class="panel-btn" onclick="changeSpeed(2.0)">⏩ 快速</button>
        </div>
        
        <!-- 缩放控制 -->
        <div class="panel-group">
             <button class="panel-btn" onclick="zoomVideo(0.2)">➕ 放大</button>
             <button class="panel-btn" onclick="zoomVideo(-0.2)">➖ 缩小</button>
             <button class="panel-btn" onclick="resetZoom()">🔄 重置</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ 配置区域：请修改为你自己的仓库信息
    const owner = 'Jtstv';           
    const repo = 'Jtstv.github.io';  
    const path = 'sp';               

    // 核心链接生成逻辑
    // 使用 fastly.jsdelivr.net 加速，如果不行可以尝试 ghproxy.com
    const cdnBaseUrl = `https://fastly.jsdelivr.net/gh/${owner}/${repo}@latest`;
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    const fileListEl = document.getElementById('fileList');

    async function loadFiles() {
        fileListEl.innerHTML = '<div class="loading">正在加载文件列表...</div>';
        
        try {
            // 添加超时处理，防止无限等待
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时

            const response = await fetch(apiUrl, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!response.ok) {
                if(response.status === 404) throw new Error('找不到该文件夹 (404)');
                if(response.status === 403) throw new Error('API 访问受限 (403)，可能是访问太频繁');
                throw new Error(`连接失败 (状态码: ${response.status})`);
            }
            
            const files = await response.json();
            
            if (!Array.isArray(files)) {
                 throw new Error('获取到的数据格式不正确');
            }

            renderList(files);

        } catch (error) {
            console.error(error);
            let msg = error.message;
            if (error.name === 'AbortError') {
                msg = '网络连接超时，请检查网络';
            }
            
            // 显示错误信息和重试按钮
            fileListEl.innerHTML = `
                <div class="loading" style="color:#ff3b30;">
                    <p>❌ 加载失败</p>
                    <p style="font-size:0.9rem; color:#666;">${msg}</p>
                    <button onclick="loadFiles()" class="btn btn-retry">🔄 点击重试</button>
                </div>
            `;
        }
    }

    function renderList(files) {
        fileListEl.innerHTML = '<ul class="file-list"></ul>';
        const listContainer = fileListEl.querySelector('ul');

        if (files.length === 0) {
            fileListEl.innerHTML = '<div class="loading">该目录下空空如也</div>';
            return;
        }

        // 排序：文件夹优先，然后按名称排序
        files.sort((a, b) => {
            if (a.type === b.type) return a.name.localeCompare(b.name);
            return a.type === 'dir' ? -1 : 1;
        });

        files.forEach(file => {
            const li = document.createElement('li');
            li.className = 'file-item';
            
            const isFolder = file.type === 'dir';
            const isVideo = file.name.match(/\.(mp4|mov|webm|m4v)$/i);
            
            // 图标处理
            let icon = '📄';
            if (isFolder) icon = '📁';
            else if (isVideo) icon = '🎬';
            else if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) icon = '🖼️';

            // 构建按钮 HTML
            let buttonsHtml = '';
            
            if (isFolder) {
                // 注意：这里简单的通过 URL 参数传递路径，实际可能需要更复杂的路由逻辑
                // 简单起见，这里假设只读取根目录下的 path，如果是子文件夹，建议单独做页面
                // 为了演示，这里暂时只做展示，点击文件夹暂不跳转（除非你有多级目录需求）
                buttonsHtml = `<span style="color:#999; font-size:0.8rem;">文件夹</span>`;
            } else {
                const downloadLink = `${cdnBaseUrl}/${file.path}`;
                buttonsHtml += `<a href="${downloadLink}" class="btn btn-download" target="_blank">下载</a>`;
                
                if (isVideo) {
                    // 转义单引号防止 JS 报错
                    const safeLink = downloadLink.replace(/'/g, "\\'"); 
                    buttonsHtml += `<button onclick="playVideo('${safeLink}')" class="btn btn-play">播放</button>`;
                }
            }

            li.innerHTML = `
                <div class="file-info">
                    <span class="icon">${icon}</span>
                    <span class="name-text">${file.name}</span>
                </div>
                <div class="actions">
                    ${buttonsHtml}
                </div>
            `;
            listContainer.appendChild(li);
        });
    }

    // --- 视频播放逻辑 ---
    const modal = document.getElementById('videoModal');
    const player = document.getElementById('videoPlayer');
    const speedText = document.getElementById('speedText');
    
    // 缩放相关变量
    let currentScale = 1.0;

    function playVideo(url) {
        player.src = url;
        modal.style.display = 'flex';
        // 重置状态
        resetZoom();
        changeSpeed(1.0);
        
        // 尝试自动播放
        player.play().catch(e => console.log("自动播放被拦截，需手动点击"));
    }

    function closeVideo() {
        modal.style.display = 'none';
        player.pause();
        player.src = '';
    }

    // 变速功能
    function changeSpeed(rate) {
        player.playbackRate = rate;
        speedText.innerText = rate + 'x';
    }

    // 缩放功能
    function zoomVideo(delta) {
        currentScale += delta;
        // 限制最小 0.5倍，最大 3倍
        if (currentScale < 0.5) currentScale = 0.5;
        if (currentScale > 3.0) currentScale = 3.0;
        applyZoom();
    }

    function resetZoom() {
        currentScale = 1.0;
        applyZoom();
    }

    function applyZoom() {
        player.style.transform = `scale(${currentScale})`;
        // 当放大时，允许滚动查看
        if(currentScale > 1) {
            player.style.cursor = 'grab';
        } else {
            player.style.cursor = 'default';
        }
    }

    // 启动加载
    loadFiles();
</script>

</body>
</html>
