POST_DIR="_posts"
TODAY=$(date +%Y-%m-%d)
CHANGED=0
mkdir -p "${POST_DIR}"
cd "${POST_DIR}"

for file in *; do
  [ -d "${file}" ] && continue
  [[ "${file}" == *.md ]] && continue
  echo "${file}" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' >/dev/null && continue

  TITLE_FROM_FILENAME="${file}"
  SAFE_FILENAME=$(echo "$file" | sed 's/[\/:*?"<>|]/_/g')
  OUT_MD="${TODAY}-${SAFE_FILENAME}.md"

  {
    echo '---'
    echo "title: |-"
    echo "  ${TITLE_FROM_FILENAME}"
    echo "date: ${TODAY}"
    echo '---'
    # 读取源文件内容；空/只有空格也保留输出，不会截断
    cat "${file}"
    # cat完全无输出时补一个换行，防止md结尾异常
    echo ""
  } > "${OUT_MD}"

  if [ -f "${OUT_MD}" ];then
    rm -f "${file}"
    CHANGED=1
  fi
done

cd ..
if [[ ${CHANGED} -eq 0 ]]; then
  echo "无需要转换的文件"
  exit 0
fi

git config user.name "KBot‑Auto"
git config user.email "bot@local"
git add "${POST_DIR}/"
git commit -m "[SKIP_AUTO_TITLE] auto:文件名生成标题"
git push origin main