name: Auto‑Post：文件名做标题
on:
  push:
    branches: [ main ]
jobs:
  convert_raw_post:
    runs-on: ubuntu-latest
    if: "! contains(github.event.head_commit.message, '[SKIP_AUTO_TITLE]')"
    steps:
      - name: git原生拉取代码
        run: |
          git clone https://github.com/${GITHUB_REPOSITORY}.git .
          git config core.autocrlf false

      - name: 设置北京时间东八区
        run: |
          sudo ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo "Asia/Shanghai" | sudo tee /etc/timezone

      - name: 核心脚本：文件名作为title自动生成front‑matter
        run: |
          POST_DIR="_posts"
          TODAY=$(date +%Y-%m-%d)
          CHANGED=0
          mkdir -p "${POST_DIR}"
          cd "${POST_DIR}"

          for file in *; do
            [ -d "${file}" ] && continue
            # 已经是 .md 的旧文章直接跳过
            [[ "${file}" == *.md ]] && continue
            # 已经带日期前缀的跳过
            echo "${file}" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' >/dev/null && continue

            TITLE_FROM_FILENAME="${file}"
            TMP_RAW=$(mktemp)
            OUT_MD="${TODAY}-${file}.md"

            # 组装完整jekyll front‑matter
            {
              echo '---'
              echo "title: \"${TITLE_FROM_FILENAME}\""
              echo "date: ${TODAY}"
              echo '---'
              cat "${file}"
            } > "${TMP_RAW}"

            rm -f "${file}"
            mv "${TMP_RAW}" "${OUT_MD}"
            CHANGED=1
          done

          cd ..
          if [[ ${CHANGED} -eq 0 ]]; then
            echo "无需要转换的文件，退出"
            exit 0
          fi

          git config user.name "KBot‑Auto"
          git config user.email "bot@local"
          git add "${POST_DIR}/"
          git commit -m "[SKIP_AUTO_TITLE] auto:文件名生成标题"
          git push